<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund-Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7eb8f7"/>
      <stop offset="100%" stop-color="#3d3fa5"/>
    </linearGradient>
    <!-- Schatten-Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bgGrad)"/>

  <!-- Optional: Glanz-Overlay oben-links -->
  <ellipse cx="160" cy="140" rx="180" ry="160" fill="white" fill-opacity="0.07"/>

  <!-- Motiv: Bevölkerungsentwicklung -->
  <g filter="url(#shadow)">
    <!-- Personen -->
    <circle cx="180" cy="200" r="28" fill="#ffffff"/>
    <path d="M 140 290 Q 180 240 220 290 L 220 340 L 140 340 Z" fill="#ffffff"/>
    
    <circle cx="256" cy="160" r="34" fill="#ffffff"/>
    <path d="M 206 270 Q 256 210 306 270 L 306 340 L 206 340 Z" fill="#ffffff"/>

    <circle cx="332" cy="200" r="28" fill="#ffffff"/>
    <path d="M 292 290 Q 332 240 372 290 L 372 340 L 292 340 Z" fill="#ffffff"/>

    <!-- Trendlinie -->
    <path d="M 120 360 L 200 310 L 280 340 L 380 230" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="370,220 400,210 395,245" fill="#ffffff"/>
  </g>
</svg>